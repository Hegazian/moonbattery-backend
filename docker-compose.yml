services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: moonbattery
      POSTGRES_PASSWORD: moonbattery
      POSTGRES_DB: moonbattery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonbattery -d moonbattery"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://moonbattery:moonbattery@db:5432/moonbattery
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
